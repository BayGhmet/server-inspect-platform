services:
  api:
    build: .
    container_name: inspect-api
    ports:
      - "8000:8000"
    volumes:
      # 把数据库放在宿主机上，容器重建数据不丢
      - ./data:/app/data
    environment:
      INSPECT_DB: /app/data/inspect.db
      # 定时巡检周期（分钟），0 表示只手动触发
      SCHEDULE_MINUTES: "0"
    restart: unless-stopped
